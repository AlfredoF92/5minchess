<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>5 Min Chess - impara le 4 mosse migliori</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♟</text></svg>">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">♟</span>
        <div>
          <strong>5 Min Chess</strong>
          <span>Allenamento: tu contro il computer, con 4 suggerimenti a mossa</span>
        </div>
      </div>
    </header>

    <main class="game">
      <section class="board-col">
        <div id="board-root"></div>
        <p id="turn-banner" class="turn-banner">Caricamento</p>

        <aside class="panel">
          <div class="card">
            <div class="player opponent">
              <span class="dot"></span>
              <div>
                <div id="engine-label" class="name">Stockfish livello 1 · principiante · 1350 Elo</div>
                <label class="skill-wrap">
                  Difficoltà
                  <select id="skill" aria-label="Livello Stockfish">
                    <option value="1" selected>1 — Principiante · 1350 Elo</option>
                    <option value="2">2 — Facile · 1450 Elo</option>
                    <option value="3">3 — Amichevole · 1550 Elo</option>
                    <option value="4">4 — Intermedio · 1650 Elo</option>
                    <option value="5">5 — Medio · 1750 Elo</option>
                    <option value="6">6 — Impegnativo · 1850 Elo</option>
                    <option value="7">7 — Difficile · 2000 Elo</option>
                    <option value="8">8 — Esperto · 2150 Elo</option>
                  </select>
                </label>
              </div>
            </div>

            <div class="start-box">
              <label class="skill-wrap">
                Inizio partita
                <select id="start-opening" aria-label="Apertura iniziale">
                  <option value="start" selected>Posizione iniziale</option>
                  <option value="italian">Partita Italiana (12 mosse)</option>
                  <option value="spanish">Partita Spagnola (12 mosse)</option>
                  <option value="sicilian">Difesa Siciliana (12 mosse)</option>
                  <option value="french">Difesa Francese (12 mosse)</option>
                  <option value="caro">Difesa Caro-Kann (12 mosse)</option>
                  <option value="qgd">Gambetto di Donna (12 mosse)</option>
                  <option value="kid">Difesa Est-Indiana (12 mosse)</option>
                  <option value="english">Apertura Inglese (12 mosse)</option>
                  <option value="london">Sistema Londra (12 mosse)</option>
                  <option value="scotch">Partita Scozzese (12 mosse)</option>
                </select>
              </label>
              <p id="opening-line" class="opening-line">Si parte dalla posizione iniziale.</p>
            </div>

            <div class="toolbar">
              <button id="btn-flip" type="button" title="Gira la scacchiera">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 7h10v2H9v8H7V7zm10 10H7v-2h8V7h2v10z"/></svg>
              </button>
              <button id="btn-undo" type="button" title="Annulla l'ultima mossa">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 18l-6-6 6-6v4h8v4h-8v4z"/></svg>
              </button>
              <button id="btn-white" type="button" title="Nuova partita con il Bianco">♔</button>
              <button id="btn-black" type="button" title="Nuova partita con il Nero">♚</button>
              <button id="btn-new" type="button" title="Nuova partita">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 6v2.5l3.5-3.5L12 1.5V4a8 8 0 1 0 8 8h-2a6 6 0 1 1-6-6z"/></svg>
              </button>
            </div>

            <div class="status">
              <div id="status-icon" class="status-icon" data-kind="info">i</div>
              <p id="status-text" class="status-color">Preparazione della scacchiera</p>
              <h2 id="status-title">Caricamento</h2>
            </div>

            <div id="moves" class="moves" aria-label="Elenco mosse"></div>

            <div class="actions">
              <button id="btn-resign" type="button" title="Abbandona">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 3h2v18H6V3zm3 1l10 5-10 5V4z"/></svg>
                Abbandona
              </button>
            </div>

            <div class="player you">
              <span class="dot"></span>
              <div>
                <div id="player-name" class="name">Tu</div>
                <div class="rating">giocatore</div>
              </div>
            </div>
          </div>
        </aside>
      </section>

      <section class="coach-col">
        <div class="king-talk">
          <div class="king-side">
            <img src="pieces/wK.svg" alt="">
            <strong>Il Re</strong>
          </div>
          <blockquote class="speech" aria-live="polite">
            <p id="king-note">Buona fortuna!</p>
          </blockquote>
        </div>
        <div class="aid-bar">
          <button id="btn-aid-moves" class="is-on" type="button">Evidenzia le mosse</button>
          <button id="btn-aid-threats" type="button">Evidenzia i minacciati</button>
        </div>
        <div id="hints" class="hints" aria-label="Suggerimenti del Re"></div>
        <div class="hint-nav">
          <button id="btn-prev-hints" class="hint-nav-btn" type="button" disabled title="4 mosse precedenti" aria-label="4 mosse precedenti">◀</button>
          <button id="btn-more-hints" class="more-hints" type="button" disabled>Carica altre 4 mosse</button>
          <button id="btn-next-hints" class="hint-nav-btn" type="button" disabled title="4 mosse successive" aria-label="4 mosse successive">▶</button>
        </div>
      </section>
    </main>
  </div>

  <div id="promo" class="promo" hidden></div>
  <div id="overlay" class="overlay" hidden>
    <div class="overlay-card">
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
